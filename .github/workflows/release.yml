name: Release Stacki WSL

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stacki-wsl-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'leemullet/stacki' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate version and release ownership
        run: node scripts/windows-release.js preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test updater and WSL regressions
        run: node --test test/auto-update.test.js test/windows-release.test.js test/project-paths.test.js test/component-preview.test.js test/wsl-preview.test.js test/wsl-runtime.test.js
      - run: npm run build
      - name: Package Windows installer without publishing
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged feed and update checksums
        run: node scripts/windows-release.js verify
      - name: Retain installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: stacki-wsl-windows
          path: |
            release/Stacki-WSL-Setup-*.exe
            release/Stacki-WSL-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Publish complete release
        run: node scripts/windows-release.js publish
        env:
          GH_TOKEN: ${{ github.token }}
